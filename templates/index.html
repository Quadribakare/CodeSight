{% extends "base.html" %}
{% block title %}Drawings{% endblock %}
{% block content %}
<h1>Drawings</h1>

<form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data" class="upload-form">
  <input type="file" name="pdf_file" accept="application/pdf" required>
  <button type="submit" class="btn btn-primary">Upload PDF</button>
</form>

<div class="pdf-list">
  {% for pdf in pdfs %}
  <div class="pdf-card">
    <a class="pdf-card-link" href="{{ url_for('dashboard', filename=pdf.filename) }}">
      <div class="pdf-name">{{ pdf.filename }}</div>
      <div class="stage-dots">
        <span class="pill {{ 'pill-on' if pdf.has_a and pdf.has_b }}" title="Stages A + B: classification and fact extraction">Analysis</span>
        <span class="pill {{ 'pill-on' if pdf.has_c and pdf.has_d }}" title="Stages C + D: regulation check and missing items">Report</span>
      </div>
    </a>
    <form action="{{ url_for('delete_pdf', filename=pdf.filename) }}" method="post"
          onsubmit="return confirm('Delete {{ pdf.filename }} and all its results? This cannot be undone.');">
      <button type="submit" class="btn btn-danger btn-sm">Delete</button>
    </form>
  </div>
  {% else %}
  <p class="empty">No PDFs yet — upload one above, or drop a file into the data/ folder.</p>
  {% endfor %}
</div>
{% endblock %}
